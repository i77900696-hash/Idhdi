<!DOCTYPE html><html lang=bn><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>V8 FINAL</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}body{background:#000;color:#fff;height:100dvh;overflow:hidden;display:flex;flex-direction:column}.hidden{display:none!important}.main{max-width:430px;margin:0 auto;width:100%;height:100dvh;background:#000;overflow-y:auto;padding:10px 12px 120px 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.cardBig{border:2.5px solid;border-radius:16px;padding:18px 10px;text-align:center;background:#0a0a0a;min-height:95px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}.c-blue{border-color:#00c8ff}.c-green{border-color:#00ff88}.c-pink{border-color:#ff5a8a}.c-red{border-color:#ff3355}.c-yellow{border-color:#ffcc00}.addBox{margin-top:16px;border:2.5px dashed #00ff88;border-radius:16px;padding:20px;text-align:center;color:#00ff88;font-weight:800;background:#001a0f;cursor:pointer}.chatPage{max-width:430px;margin:0 auto;width:100%;height:100dvh;background:#000;display:flex;flex-direction:column;overflow:hidden}.chatBox{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#0a0a0a;margin:8px;border-radius:16px;border:1px solid #333}.bubble{max-width:80%;padding:10px 14px;border-radius:18px;font-size:14px;word-wrap:break-word;position:relative}.left{align-self:flex-start;background:#1e1e1e;color:#fff;border-bottom-left-radius:4px}.right{align-self:flex-end;background:#ff5a8a;color:#fff;border-bottom-right-radius:4px}.seen{font-size:10px;display:block;text-align:right;margin-top:4px}.del{position:absolute;top:-6px;right:-6px;background:#f34;color:#fff;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer}.blurOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(25px);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}.lockInput{width:100%;max-width:300px;background:#1e1e1e;border:2px solid #00ff88;border-radius:12px;padding:14px;color:#fff;font-size:18px;text-align:center;outline:none}.btn{width:100%;background:#00ff88;color:#000;font-weight:900;padding:15px;border:none;border-radius:12px;font-size:17px;cursor:pointer}.modalBg{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px}.modalBox{background:#0f0f0f;border:2px solid #00ff88;border-radius:16px;padding:20px;width:100%;max-width:340px;text-align:center}.input{width:100%;background:#1e1e1e;border:1.5px solid #00ff88;border-radius:12px;padding:14px;color:#fff;margin-bottom:10px;outline:none;font-size:16px}.controlRoom{background:#050505;border:2.5px solid #ff00aa55;border-radius:18px;padding:14px;margin:14px 0}.switch{width:52px;height:30px;border-radius:15px;position:relative}.switch.on{background:#00e5ff}.switch.off{background:#ff4d8a}.knob{width:24px;height:24px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.3s}.inputBar{flex-shrink:0;background:#000;padding:10px 12px;display:flex;gap:8px;align-items:center;border-top:1px solid #222}.msgInput{flex:1;background:#1e1e1e;border:1.5px solid #00ff88;border-radius:25px;padding:14px 18px;color:#fff;outline:none}.sendBtn{background:#ff2e6b;color:#fff;border:none;border-radius:50%;width:50px;height:50px;font-weight:800;font-size:20px;cursor:pointer}.iconBtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;border:2px solid #333;background:#1a1a1a}.voiceBar{flex-shrink:0;background:#001a0f;border:1.5px solid #ff3344;border-radius:12px;padding:10px;margin:0 12px 8px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between}.hdBadge{background:linear-gradient(90deg,#ff00aa,#00e5ff);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px}</style></head><body><div id=blurLock class="blurOverlay hidden"><div style="font-size:50px">🔒</div><div style="font-size:22px;font-weight:900;color:#00ff88">মিনিমাইজ - আবার পাস</div><input id=blurPass type=password class=lockInput placeholder="••••"><button class=btn style="max-width:300px;margin-top:12px" onclick="unlockBlur()">UNLOCK</button></div><div id=passModal class="modalBg hidden"><div class=modalBox><h3 id=modalTitle style="color:#00ff88">🔒</h3><p id=modalSub style="font-size:11px;color:#aaa;margin:8px 0"></p><input id=modalPass type=password class=lockInput placeholder="••••"><div style="display:flex;gap:10px;margin-top:12px"><button class=btn style="background:#333;color:#fff" onclick="closeModal(false)">Cancel</button><button class=btn onclick="closeModal(true)">OK</button></div></div></div><div id=pLogin style="max-width:430px;margin:0 auto;width:100%;height:100dvh;padding:12px;background:#000;overflow-y:auto"><div style="border:2.5px solid #00ff88;border-radius:18px;padding:18px;background:#0f0f0f"><h2 style="color:#00ff88;text-align:center">🔐 V8 FINAL <span class=hdBadge>NO PASS SHOW</span></h2><p style="font-size:11px;color:#00ff88;text-align:center;margin:8px 0">নাম সেভ - পাস সেভ না - পাস কোথাও না</p><input id=nI class=input placeholder="নাম - সেভ থাকবে"><input id=pI type=password class=input placeholder="পাস •••• - সেভ না" style="border-color:#ffcc00"><button class=btn onclick="doLogin()">UNLOCK</button></div></div><div id=pRooms class="main hidden"><div style="background:#0a0a0a;border:2px solid #ff00aa55;border-radius:16px;padding:14px"><h2 style="font-size:15px">MASTER BOX 99 <span class=hdBadge>99 INSIDE</span></h2><p style="font-size:11px;color:#00ff88">Link কোথাও না | 99 Owner Only</p></div><div class=grid id=grid></div><div class=addBox onclick="newRoom()">➕ নতুন প্রাইভেট রুম</div><div style="margin-top:12px;text-align:center"><button onclick="openControlRoom()" style="background:#111;border:2px solid #ff2a8a;color:#ff2a8a;padding:12px 20px;border-radius:20px;font-weight:800">🛡️ মালিকের কন্ট্রোল - 99</button></div><div style="background:#111;border-radius:10px;padding:10px;margin-top:12px"><b style="font-size:12px">তোমার লিংক:</b><div id=myLink style="font-size:11px;color:#2ee5a0;word-break:break-all;margin:6px 0"></div><button onclick="copyLink()" style="background:#222;border:1px dashed #2ee5a0;color:#2ee5a0;padding:8px;width:100%;border-radius:8px">🔗 কপি</button></div></div><div id=pChat class="chatPage hidden"><div style="padding:10px;background:#000;border-bottom:1px solid #222"><div style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;align-items:center;gap:8px"><span onclick="goRooms()" style="font-size:20px;cursor:pointer">←</span><b id=cTitle style="color:#00ff88">Room</b></div><button style="background:#1a1a1a;border:1px solid #00ff88;color:#00ff88;border-radius:8px;padding:5px 10px;font-size:11px" onclick="changeRoomPass()">🔑 পাস চেঞ্জ</button></div><div style="font-size:10px;color:#888;margin-top:4px">তুমি ডানে গোলাপি - আমি বামে ধূসর - Seen ✓✓</div></div><div id=controlRoomInChat class="controlRoom hidden"><div style="text-align:center;color:#ff00aa;font-weight:800">🔒 99 FEATURES - Owner Only</div><div id=fList></div></div><div id=chatBox class=chatBox></div><div id=voiceBar class="voiceBar hidden"><span style="color:#ff3344">● REC</span><span id=voiceTime style="color:#fff;font-weight:700">00:00</span><button onclick="stopVoice()" style="background:#00ff88;color:#000;border:none;padding:8px 14px;border-radius:8px;font-weight:700">Send</button><button onclick="cancelVoice()" style="background:#333;color:#fff;border:none;padding:6px 10px;border-radius:8px">X</button></div><div style="display:flex;gap:8px;padding:8px 12px;background:#000;border-top:1px solid #111"><div class=iconBtn onclick="startAudioCall()">📞</div><div class=iconBtn onclick="document.getElementById('fI').click()">📷</div><div class=iconBtn onclick="document.getElementById('vI').click()">🎥</div><div class=iconBtn onclick="toggleVoice()">🎤</div><div class=iconBtn onclick="startVideoCall()">📹</div></div><div class=inputBar><input id=mI class=msgInput placeholder="মেসেজ - লেখা দেখা যাবে - Seen হবে"><button class=sendBtn onclick="sendMsg()">➤</button></div><input id=fI type=file accept="image/*" hidden><input id=vI type=file accept="video/*" hidden></div><script>const P="2919",S="0175";const GITHUB_BASE="https://i77900696-hash.github.io/Now-link/";let curName='',curRoom=null,rooms=[],voiceTimer=null,voiceSec=0,modalResolver=null,ownerName='',recorder=null,voiceChunks=[];let features={};for(let i=1;i<=99;i++)features['f'+i]=Math.random()>0.5;rooms=JSON.parse(localStorage.getItem('rooms_v8_final')||'[]');if(!rooms.length){rooms=[{id:'control',name:'🔒 মালিকের কন্ট্রোল - 99 FEATURES',icon:'🔒',color:'c-pink',isControl:true},{id:'private_zara',name:'Zara প্রাইভেট',icon:'💖',color:'c-pink',isPrivate:true},{id:'private_bou',name:'বন্ধু বউ প্রাইভেট',icon:'❤️',color:'c-red',isPrivate:true},{id:'study',name:'Study Room #12',icon:'📚',color:'c-blue',isPrivate:false},{id:'gaming',name:'Gaming Lounge',icon:'🎮',color:'c-green',isPrivate:false}];localStorage.setItem('rooms_v8_final',JSON.stringify(rooms));}
function save(){localStorage.setItem('rooms_v8_final',JSON.stringify(rooms));localStorage.setItem('features_99',JSON.stringify(features));}
function askPassword(t,s){return new Promise(r=>{document.getElementById('modalTitle').innerText=t;document.getElementById('modalSub').innerText=s||'';document.getElementById('modalPass').value='';document.getElementById('passModal').classList.remove('hidden');modalResolver=r;})}
function closeModal(o){let v=document.getElementById('modalPass').value;document.getElementById('passModal').classList.add('hidden');if(modalResolver){modalResolver(o?v:null);modalResolver=null}}
window.onload=()=>{let urlName=new URLSearchParams(location.search).get('name');let savedName=localStorage.getItem('vp_name_v8');if(urlName)document.getElementById('nI').value=urlName;else if(savedName)document.getElementById('nI').value=savedName;ownerName=localStorage.getItem('owner_name_v8')||'';document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&curName){document.getElementById('blurLock').classList.remove('hidden');}});updateLink();};
function unlockBlur(){let p=document.getElementById('blurPass').value;if(p!==P&&p!==S){alert('ভুল পাস!');return;}document.getElementById('blurLock').classList.add('hidden');}
async function doLogin(){let n=document.getElementById('nI').value.trim().replace(/\s+/g,'');let p=document.getElementById('pI').value.trim();if(!n){alert('নাম দাও');return;}if(!p){alert('পাস দিতেই হবে');return;}if(p!==P&&p!==S){alert('❌ ভুল পাস!');document.getElementById('pI').value='';return;}localStorage.setItem('vp_name_v8',n);curName=n;if(!ownerName){ownerName=n;localStorage.setItem('owner_name_v8',n);}document.getElementById('pLogin').classList.add('hidden');document.getElementById('pRooms').classList.remove('hidden');render();updateLink();}
function render(){let g=document.getElementById('grid');g.innerHTML='';rooms.forEach(r=>{g.innerHTML+=`<div class="cardBig ${r.color}" onclick="openRoom('${r.id}')"><span style="font-size:22px">${r.icon}</span><span style="font-size:13px;font-weight:700">${r.name}</span><span style="font-size:9px;color:#aaa">${r.isPrivate?'🔒 Private':'Public'} - PASS</span></div>`});}
async function openRoom(id){let r=rooms.find(x=>x.id===id);let roomPass=localStorage.getItem('room_pass_'+id)||P;let p=await askPassword('🔒 '+r.name,'পাস দাও - কোথাও শো না');if(p!==roomPass&&p!==P&&p!==S){alert('❌ ভুল পাস');return;}curRoom=id;document.getElementById('pRooms').classList.add('hidden');document.getElementById('pChat').classList.remove('hidden');document.getElementById('cTitle').innerText=r.name;document.getElementById('controlRoomInChat').classList.toggle('hidden',!r.isControl);if(r.isControl)renderFeatures();showChat();}
function goRooms(){document.getElementById('pChat').classList.add('hidden');document.getElementById('pRooms').classList.remove('hidden');curRoom=null;}
function showChat(){let b=document.getElementById('chatBox');if(!b)return;b.innerHTML='';let key='chat_isolated_'+curRoom;let msgs=JSON.parse(localStorage.getItem(key)||'[]');msgs.forEach((m,i)=>{let isMe=m.sender===curName;let cls=isMe?'right':'left';let seenTick=isMe?(m.seen?' <span style="color:#00aaff">✓✓ Seen</span>':' <span style="color:#ccc">✓ Sent</span>'):'';let media='';if(m.img)media=`<img src="${m.img}" style="max-width:100%;border-radius:12px;margin-top:6px;display:block">`;if(m.video)media+=`<video src="${m.video}" controls style="max-width:100%;border-radius:12px;margin-top:6px;display:block"></video>`;if(m.audio)media+=`<audio src="${m.audio}" controls style="width:220px;margin-top:6px;display:block"></audio>`;b.innerHTML+=`<div class="bubble ${cls}">${m.t||''}${media}<span class=seen>${m.time}${seenTick}</span><span class=del onclick="delMsg(${i})">x</span></div>`});setTimeout(()=>{b.scrollTop=b.scrollHeight},50);setTimeout(()=>{let d=JSON.parse(localStorage.getItem(key)||'[]');let ch=false;d.forEach(x=>{if(x.sender!==curName&&!x.seen){x.seen=true;ch=true;}});if(ch)localStorage.setItem(key,JSON.stringify(d));},1000);}
function sendMsg(){let t=document.getElementById('mI').value.trim();if(!t)return;let key='chat_isolated_'+curRoom;let d=JSON.parse(localStorage.getItem(key)||'[]');d.push({t,sender:curName,time:new Date().toLocaleTimeString().slice(0,5),seen:false});localStorage.setItem(key,JSON.stringify(d));document.getElementById('mI').value='';showChat();}
document.getElementById('fI').addEventListener('change',function(){let f=this.files[0];if(!f)return;let rd=new FileReader();rd.onload=e=>{let key='chat_isolated_'+curRoom;let d=JSON.parse(localStorage.getItem(key)||'[]');d.push({t:'📷 HD',img:e.target.result,sender:curName,time:new Date().toLocaleTimeString().slice(0,5),seen:false});localStorage.setItem(key,JSON.stringify(d));showChat();};rd.readAsDataURL(f);this.value='';});
document.getElementById('vI').addEventListener('change',function(){let f=this.files[0];if(!f)return;let rd=new FileReader();rd.onload=e=>{let key='chat_isolated_'+curRoom;let d=JSON.parse(localStorage.getItem(key)||'[]');d.push({t:'🎥 HD',video:e.target.result,sender:curName,time:new Date().toLocaleTimeString().slice(0,5),seen:false});localStorage.setItem(key,JSON.stringify(d));showChat();};rd.readAsDataURL(f);this.value='';});
function delMsg(i){let key='chat_isolated_'+curRoom;let d=JSON.parse(localStorage.getItem(key)||'[]');d.splice(i,1);localStorage.setItem(key,JSON.stringify(d));showChat();}
async function newRoom(){let nm=prompt('নতুন প্রাইভেট রুম নাম:');if(!nm)return;let ps=prompt('এই রুমের পাস:');if(!ps)return;let id='private_'+Date.now();rooms.push({id:id,name:nm.replace(/\s+/g,''),icon:'🔒',color:'c-yellow',isPrivate:true});localStorage.setItem('rooms_v8_final',JSON.stringify(rooms));localStorage.setItem('room_pass_'+id,ps);render();}
async function changeRoomPass(){if(!curRoom)return;let np=prompt('নতুন পাস - সবাই পারে:');if(!np)return;localStorage.setItem('room_pass_'+curRoom,np);alert('✅ পাস চেঞ্জ');}
function openControlRoom(){if(curName!==ownerName){alert('❌ শুধু মালিক '+ownerName+' 99 ফিচার');return;}openRoom('control');}
function renderFeatures(){let el=document.getElementById('fList');let h='';for(let i=1;i<=99;i++){let on=features['f'+i];h+=`<div style="background:#1a1a1a;padding:10px;border-radius:10px;display:flex;justify-content:space-between;margin:5px 0"><div><b style="font-size:12px">Feature ${i}</b><div style="font-size:9px;color:#888">Owner Only</div></div><div class="switch ${on?'on':''}" onclick="if(curName!==ownerName){alert('মালিক না');return;}features['f${i}']=!features['f${i}'];save();renderFeatures();"><div class=knob style="left:${on?'25px':'3px'}"></div></div></div>`;}el.innerHTML=h;}
function updateLink(){let isLocal=location.hostname.includes('localhost')||location.hostname.includes('127.0.0.1')||location.protocol==='file:';let base=isLocal?GITHUB_BASE:location.origin+location.pathname;let name=(localStorage.getItem('vp_name_v8')||'IBRAHIM').replace(/\s+/g,'');let link=base+'?name='+encodeURIComponent(name);let e=document.getElementById('myLink');if(e)e.innerText=link;}
function copyLink(){let isLocal=location.hostname.includes('localhost')||location.hostname.includes('127.0.0.1')||location.protocol==='file:';let base=isLocal?GITHUB_BASE:location.origin+location.pathname;let name=(localStorage.getItem('vp_name_v8')||'IBRAHIM').replace(/\s+/g,'');let link=base+'?name='+encodeURIComponent(name);navigator.clipboard.writeText(link);alert('🔗 কপি\n'+link);}
function toggleVoice(){let bar=document.getElementById('voiceBar');if(bar.classList.contains('hidden')){navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{recorder=new MediaRecorder(s);voiceChunks=[];recorder.ondataavailable=e=>voiceChunks.push(e.data);recorder.start();bar.classList.remove('hidden');voiceSec=0;voiceTimer=setInterval(()=>{voiceSec++;document.getElementById('voiceTime').innerText='00:'+String(voiceSec).padStart(2,'0');if(voiceSec>=60)stopVoice();},1000);});}else cancelVoice();}
function stopVoice(){if(recorder)recorder.stop();clearInterval(voiceTimer);document.getElementById('voiceBar').classList.add('hidden');let key='chat_isolated_'+curRoom;let d=JSON.parse(localStorage.getItem(key)||'[]');let blob=new Blob(voiceChunks,{type:'audio/webm'});let rd=new FileReader();rd.onload=e=>{d.push({t:'🎤 '+voiceSec+'s',audio:e.target.result,sender:curName,time:new Date().toLocaleTimeString().slice(0,5),seen:false});localStorage.setItem(key,JSON.stringify(d));showChat();};if(voiceChunks.length)rd.readAsDataURL(blob);}
function cancelVoice(){if(recorder)recorder.stop();clearInterval(voiceTimer);document.getElementById('voiceBar').classList.add('hidden');}
function startAudioCall(){alert('📞 Audio Call');}
function startVideoCall(){alert('📹 Video Call');}
document.getElementById('mI').addEventListener('keypress',e=>{if(e.key==='Enter')sendMsg()});
</script></body></html>
